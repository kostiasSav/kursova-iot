# Стадія 1, крок 3 — власний брокер Mosquitto з TLS і паролем.
#
# Запускайте з КОРЕНЯ репозиторію (з тієї теки, де лежить README.md):
#     mosquitto -c broker/mosquitto.conf -v
# Шляхи до файлів нижче відраховуються від теки, з якої запущено
# mosquitto, а не від теки цього файла.
#
# Перед першим запуском створіть:
#     python broker/make_certs.py              -> broker/certs/
#     mosquitto_passwd -c broker/passwd node   -> broker/passwd
#
# Коментарі в цьому файлі — лише окремими рядками: текст після
# значення в тому самому рядку Mosquitto вважає частиною значення.

# Час у журналі брокера — годинник, а не секунди від 1970 року.
log_timestamp_format %H:%M:%S

# --- Хто може підключатися (однаково для обох портів) -----------------
# Без імені й пароля — ніхто. У файлі паролів зберігаються лише хеші.
allow_anonymous false
password_file broker/passwd

# --- Порт 1883: БЕЗ шифрування -----------------------------------------
# Лише для порівняння «до»: телеметрія і навіть пароль ідуть відкритим
# текстом, і Wireshark їх покаже.
# 127.0.0.1 означає, що брокер приймає з'єднання лише з цього самого
# комп'ютера; з мережі (Wi-Fi гуртожитку чи університету) його не видно.
listener 1883 127.0.0.1

# --- Порт 8883: TLS -----------------------------------------------------
# Той самий брокер, але кожне з'єднання зашифроване. Клієнт перевіряє
# server.crt за ca.crt і так переконується, що говорить саме з цим
# брокером, а не з підставним.
listener 8883 127.0.0.1
cafile broker/certs/ca.crt
certfile broker/certs/server.crt
keyfile broker/certs/server.key
